apiVersion: titlis.io/v1
kind: ServiceDefinition
metadata:
  name: titlis-api
  workload_match:
    namespaces: [titlis-preprod, titlis-prod]
    name_pattern: "^titlis-api(-.*)?$"
spec:
  owner:
    team: platform
    contacts:
      - type: slack
        value: "#platform-oncall"
  gitops:
    layout: folder_per_env
    paths:
      dev:
        path: titlis-api/manifest/kubernetes/develop/deploy.yaml
        base_branch: develop
      hml:
        path: titlis-api/manifest/kubernetes/release/deploy.yaml
        base_branch: release
      prd:
        path: titlis-api/manifest/kubernetes/main/deploy.yaml
        base_branch: main
    pipeline_watcher: argocd
  remediation:
    enabled: true
    overrides:
      hpa_environment_templates:
        dev: { min: 2, max: 3, target_cpu: 70 }
        hml: { min: 2, max: 3, target_cpu: 70 }
        prd: { min: 2, max: 6, target_cpu: 70 }
