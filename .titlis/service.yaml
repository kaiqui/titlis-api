apiVersion: titlis.io/v1
kind: ServiceDefinition
metadata:
  name: titlis-api
  workload_match:
    namespaces: [titlis-preprod, titlis-prod]
    name_pattern: "^titlis-api(-.*)?$"
spec:
  owner:
    team: platform
    contacts:
      - type: slack
        value: "#platform-oncall"
  gitops:
    layout: folder_per_env
    paths:
      dev:
        path: k8s/preprod/minikube-preprod.yaml
        base_branch: main
      prd:
        path: k8s/preprod/minikube-preprod.yaml
        base_branch: main
    pipeline_watcher: argocd
  remediation:
    enabled: true
    overrides:
      hpa_environment_templates:
        dev: { min: 1, max: 3, target_cpu: 80 }
        prd: { min: 2, max: 6, target_cpu: 70 }
