apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: titlis-api-config\n  namespace: titlis-preprod\ndata:\n  PORT: "8080"\n  DB_POOL_MAX: "3"\n  TITLIS_APP_ENV: preprod\n  TITLIS_AUTH_MODE: mixed\n  TITLIS_AUTH_ISSUER: https://trial-8891784.okta.com/oauth2/aus11ip021xOHyY1d698/.well-known/oauth-authorization-server\n  TITLIS_AUTH_AUDIENCE: api://titlis\n  TITLIS_AUTH_ACCESS_TOKEN_TTL_MINUTES: "720"\n  TITLIS_OKTA_ISSUER: https://trial-8891784.okta.com/oauth2/aus11ip021xOHyY1d698/.well-known/oauth-authorization-server\n  TITLIS_OKTA_AUDIENCE: api://titlis\n  TITLIS_DEV_BYPASS_ENABLED: "false"\n  TITLIS_UDP_PORT: "8125"\n  TITLIS_UDP_WORKERS: "1"\n  TITLIS_CORS_ALLOWED_ORIGINS: http://localhost:30080\n  TITLIS_AI_URL: http://titlis-ai:8001\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: titlis-api\n  namespace: titlis-preprod\nspec:\n  replicas: 2\n  selector:\n    matchLabels:\n      app: titlis-api\n  strategy:\n    type: RollingUpdate\n    rollingUpdate:\n      maxSurge: 25%\n      maxUnavailable: 25%\n  template:\n    metadata:\n      labels:\n        app: titlis-api\n        admission.datadoghq.com/enabled: "true"\n        tags.datadoghq.com/env: preprod\n        tags.datadoghq.com/service: titlis-api\n        tags.datadoghq.com/version: v3.0.0\n      annotations:\n        admission.datadoghq.com/java-lib.version: latest\n    spec:\n      terminationGracePeriodSeconds: 30\n      containers:\n        - name: titlis-api\n          image: kailima/titlis-api:preprod-latest\n          imagePullPolicy: IfNotPresent\n          ports:\n            - name: http\n              containerPort: 8080\n              protocol: TCP\n            - name: udp-events\n              containerPort: 8125\n              protocol: UDP\n          env:\n            - name: PORT\n              valueFrom:\\n                configMapKeyRef:\\n                  name: titlis-api-config\\n                  key: PORT\n            - name: DATABASE_URL\n              valueFrom:\\n                secretKeyRef:\\n                  name: titlis-preprod-secrets\\n                  key: DATABASE_URL\n            - name: DATABASE_USER\n              valueFrom:\\n                secretKeyRef:\\n                  name: titlis-preprod-secrets\\n                  key: DATABASE_USER\n            - name: DATABASE_PASSWORD\n              valueFrom:\\n                secretKeyRef:\\n                  name: titlis-preprod-secrets\\n                  key: DATABASE_PASSWORD\n            - name: TITLIS_AUTH_ISSUER\n              valueFrom:\\n                configMapKeyRef:\\n                  name: titlis-api-config\\n                  key: TITLIS_AUTH_ISSUER\n            - name: TITLIS_AUTH_AUDIENCE\n              valueFrom:\\n                configMapKeyRef:\\n                  name: titlis-api-config\\n                  key: TITLIS_AUTH_AUDIENCE\n            - name: TITLIS_AUTH_ACCESS_TOKEN_SECRET\n              valueFrom:\\n                secretKeyRef:\\n                  name: titlis-preprod-secrets\\n                  key: TITLIS_AUTH_ACCESS_TOKEN_SECRET\n            - name: TITLIS_AUTH_ACCESS_TOKEN_TTL_MINUTES\n              valueFrom:\\n                configMapKeyRef:\\n                  name: titlis-api-config\\n                  key: TITLIS_AUTH_ACCESS_TOKEN_TTL_MINUTES\n            - name: TITLIS_OKTA_ISSUER\n              valueFrom:\\n                configMapKeyRef:\\n                  name: titlis-api-config\\n                  key: TITLIS_OKTA_ISSUER\n            - name: TITLIS_OKTA_AUDIENCE\n              valueFrom:\\n                configMapKeyRef:\\n                  name: titlis-api-config\\n                  key: TITLIS_OKTA_AUDIENCE\n            - name: TITLIS_OKTA_CLIENT_ID\n              valueFrom:\\n                secretKeyRef:\\n                  name: titlis-preprod-secrets\\n                  key: TITLIS_OKTA_CLIENT_ID\n            - name: TITLIS_AUTH_MODE\n              valueFrom:\\n                configMapKeyRef:\\n                  name: titlis-api-config\\n                  key: TITLIS_AUTH_MODE\n            - name: TITLIS_APP_ENV\n              valueFrom:\\n                configMapKeyRef:\\n                  name: titlis-api-config\\n                  key: TITLIS_APP_ENV\n            - name: TITLIS_DEV_BYPASS_ENABLED\n              valueFrom:\\n                configMapKeyRef:\\n                  name: titlis-api-config\\n                  key: TITLIS_DEV_BYPASS_ENABLED\n            - name: TITLIS_UDP_PORT\n              valueFrom:\\n                configMapKeyRef:\\n                  name: titlis-api-config\\n                  key: TITLIS_UDP_PORT\n            - name: TITLIS_UDP_WORKERS\n              valueFrom:\\n                configMapKeyRef:\\n                  name: titlis-api-config\\n                  key: TITLIS_UDP_WORKERS\n            - name: TITLIS_CORS_ALLOWED_ORIGINS\n              valueFrom:\\n                configMapKeyRef:\\n                  name: titlis-api-config\\n                  key: TITLIS_CORS_ALLOWED_ORIGINS\n            - name: DB_POOL_MAX\n              valueFrom:\\n                configMapKeyRef:\\n                  name: titlis-api-config\\n                  key: DB_POOL_MAX\n            - name: TITLIS_AI_URL\n              valueFrom:\\n                configMapKeyRef:\\n                  name: titlis-api-config\\n                  key: TITLIS_AI_URL\n            - name: TITLIS_AI_INTERNAL_SECRET\n              valueFrom:\\n                secretKeyRef:\\n                  name: titlis-preprod-secrets\\n                  key: TITLIS_AI_INTERNAL_SECRET\n            - name: DD_AGENT_HOST\n              valueFrom:\\n                fieldRef:\\n                  fieldPath: status.hostIP\n            - name: DD_SERVICE\n              value: titlis-api\n            - name: DD_ENV\n              value: preprod\n            - name: DD_VERSION\n              value: v3.0.0\n          resources:\n            requests:\n              cpu: 200m\n              memory: 256Mi\n            limits:\n              cpu: 500m\n              memory: 512Mi\n          livenessProbe:\n            httpGet:\n              path: /health\n              port: http\n            initialDelaySeconds: 20\n            periodSeconds: 15\n          readinessProbe:\n            httpGet:\n              path: /health\n              port: http\n            initialDelaySeconds: 10\n            periodSeconds: 10\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: titlis-api\n  namespace: titlis-preprod\nspec:\n  selector:\n    app: titlis-api\n  type: ClusterIP\n  ports:\n    - name: http\n      port: 8080\n      protocol: TCP\n      targetPort: http\n    - name: udp-events\n      port: 8125\n      protocol: UDP\n      targetPort: udp-events\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: titlis-api-nodeport\n  namespace: titlis-preprod\nspec:\n  selector:\n    app: titlis-api\n  type: NodePort\n  ports:\n    - name: http\n      port: 8080\n      nodePort: 30081\n      protocol: TCP\n      targetPort: http\n    - name: udp-events\n      port: 8125\n      nodePort: 30125\n      protocol: UDP\n      targetPort: udp-events\n---\napiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nmetadata:\n  name: titlis-api\n  namespace: titlis-preprod\nspec:\n  scaleTargetRef:\n    apiVersion: apps/v1\n    kind: Deployment\n    name: titlis-api\n  minReplicas: 2\n  maxReplicas: 10\n  metrics:\n    - type: Resource\n      resource:\n        name: cpu\n        target:\n          type: Utilization\n          averageUtilization: 60