apiVersion: v1
kind: Namespace
metadata:
  name: __NAMESPACE__
---
apiVersion: v1
kind: Secret
metadata:
  name: titlis-preprod-secrets
  namespace: __NAMESPACE__
type: Opaque
stringData:
  DATABASE_URL: "__DATABASE_URL__"
  DATABASE_MIGRATION_URL: "__DATABASE_MIGRATION_URL__"
  DATABASE_USER: "__DATABASE_USER__"
  DATABASE_PASSWORD: "__DATABASE_PASSWORD__"
  DATABASE_MIGRATION_USER: "__DATABASE_MIGRATION_USER__"
  DATABASE_MIGRATION_PASSWORD: "__DATABASE_MIGRATION_PASSWORD__"
  TITLIS_AUTH_ACCESS_TOKEN_SECRET: "__TITLIS_AUTH_ACCESS_TOKEN_SECRET__"
  TITLIS_OKTA_CLIENT_ID: "__TITLIS_OKTA_CLIENT_ID__"
  TITLIS_AI_INTERNAL_SECRET: "__TITLIS_AI_INTERNAL_SECRET__"
  TITLIS_SCOREOPS_SECRET: "__TITLIS_SCOREOPS_SECRET__"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: titlis-api-config
  namespace: __NAMESPACE__
data:
  PORT: "8080"
  TITLIS_AUTH_ISSUER: "__TITLIS_AUTH_ISSUER__"
  TITLIS_AUTH_AUDIENCE: "__TITLIS_AUTH_AUDIENCE__"
  TITLIS_AUTH_ACCESS_TOKEN_TTL_MINUTES: "720"
  TITLIS_OKTA_ISSUER: "__TITLIS_OKTA_ISSUER__"
  TITLIS_OKTA_AUDIENCE: "__TITLIS_OKTA_AUDIENCE__"
  TITLIS_AUTH_MODE: "__TITLIS_AUTH_MODE__"
  TITLIS_APP_ENV: "preprod"
  TITLIS_DEV_BYPASS_ENABLED: "__TITLIS_DEV_BYPASS_ENABLED__"
  TITLIS_CORS_ALLOWED_ORIGINS: "http://localhost:30080"
  DB_POOL_MAX: "4"
  DB_POOL_MIN_IDLE: "1"
  DB_POOL_MAX_LIFETIME: "300000"
  DB_POOL_CONNECTION_TIMEOUT: "10000"
  TITLIS_AI_URL: "http://titlis-ai:8001"
  TITLIS_SCOREOPS_URL: "http://titlis-scoreops:8090"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: titlis-api
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: titlis-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: titlis-api
        titlis.io/github-owner: kaiqui
        titlis.io/repo: titlis-api
        admission.datadoghq.com/enabled: "true"
        tags.datadoghq.com/env: "preprod"
        tags.datadoghq.com/service: "titlis-api"
        tags.datadoghq.com/version: "__IMAGE_TAG__"
      annotations:
        admission.datadoghq.com/java-lib.version: "latest"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: titlis-api
          image: __DOCKERHUB_USER__/titlis-api:__IMAGE_TAG__
          imagePullPolicy: __IMAGE_PULL_POLICY__
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: titlis-api-config
                  key: PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: titlis-preprod-secrets
                  key: DATABASE_URL
            - name: DATABASE_MIGRATION_URL
              valueFrom:
                secretKeyRef:
                  name: titlis-preprod-secrets
                  key: DATABASE_MIGRATION_URL
            - name: DATABASE_MIGRATION_USER
              valueFrom:
                secretKeyRef:
                  name: titlis-preprod-secrets
                  key: DATABASE_MIGRATION_USER
            - name: DATABASE_MIGRATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: titlis-preprod-secrets
                  key: DATABASE_MIGRATION_PASSWORD
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: titlis-preprod-secrets
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: titlis-preprod-secrets
                  key: DATABASE_PASSWORD
            - name: TITLIS_AUTH_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: titlis-api-config
                  key: TITLIS_AUTH_ISSUER
            - name: TITLIS_AUTH_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: titlis-api-config
                  key: TITLIS_AUTH_AUDIENCE
            - name: TITLIS_AUTH_ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: titlis-preprod-secrets
                  key: TITLIS_AUTH_ACCESS_TOKEN_SECRET
            - name: TITLIS_AUTH_ACCESS_TOKEN_TTL_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: titlis-api-config
                  key: TITLIS_AUTH_ACCESS_TOKEN_TTL_MINUTES
            - name: TITLIS_OKTA_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: titlis-api-config
                  key: TITLIS_OKTA_ISSUER
            - name: TITLIS_OKTA_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: titlis-api-config
                  key: TITLIS_OKTA_AUDIENCE
            - name: TITLIS_OKTA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: titlis-preprod-secrets
                  key: TITLIS_OKTA_CLIENT_ID
            - name: TITLIS_AUTH_MODE
              valueFrom:
                configMapKeyRef:
                  name: titlis-api-config
                  key: TITLIS_AUTH_MODE
            - name: TITLIS_APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: titlis-api-config
                  key: TITLIS_APP_ENV
            - name: TITLIS_DEV_BYPASS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: titlis-api-config
                  key: TITLIS_DEV_BYPASS_ENABLED
            - name: TITLIS_CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: titlis-api-config
                  key: TITLIS_CORS_ALLOWED_ORIGINS
            - name: DB_POOL_MAX
              valueFrom:
                configMapKeyRef:
                  name: titlis-api-config
                  key: DB_POOL_MAX
            - name: DB_POOL_MIN_IDLE
              valueFrom:
                configMapKeyRef:
                  name: titlis-api-config
                  key: DB_POOL_MIN_IDLE
            - name: DB_POOL_MAX_LIFETIME
              valueFrom:
                configMapKeyRef:
                  name: titlis-api-config
                  key: DB_POOL_MAX_LIFETIME
            - name: DB_POOL_CONNECTION_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: titlis-api-config
                  key: DB_POOL_CONNECTION_TIMEOUT
            - name: TITLIS_AI_URL
              valueFrom:
                configMapKeyRef:
                  name: titlis-api-config
                  key: TITLIS_AI_URL
            - name: TITLIS_AI_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: titlis-preprod-secrets
                  key: TITLIS_AI_INTERNAL_SECRET
            - name: TITLIS_SCOREOPS_URL
              valueFrom:
                configMapKeyRef:
                  name: titlis-api-config
                  key: TITLIS_SCOREOPS_URL
            - name: TITLIS_SCOREOPS_SECRET
              valueFrom:
                secretKeyRef:
                  name: titlis-preprod-secrets
                  key: TITLIS_SCOREOPS_SECRET
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_SERVICE
              value: "titlis-api"
            - name: DD_ENV
              value: "preprod"
            - name: DD_VERSION
              value: "__IMAGE_TAG__"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: titlis-api
  namespace: __NAMESPACE__
spec:
  selector:
    app: titlis-api
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: titlis-api-nodeport
  namespace: __NAMESPACE__
spec:
  selector:
    app: titlis-api
  type: NodePort
  ports:
    - name: http
      port: 8080
      nodePort: 30081
      protocol: TCP
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: titlis-api
  namespace: __NAMESPACE__
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: titlis-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
